[project]
name = "polyglot-tracker"
version = "1.0.0"
description = "Smart face-tracking sidecar for PolyglotClipper (insightface + silero + mediapipe)"
requires-python = ">=3.11"
dependencies = [
    "insightface==0.7.3",
    "onnxruntime>=1.17",
    "numpy",
    "opencv-python-headless",
    "scikit-learn",
    "scipy",
    "mediapipe",
]

[project.optional-dependencies]
dev = ["pytest"]
